[package]
name = "honba-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
description = "Canonical domain types, market data models, orders, decisions, and money for Honba"

[dependencies]
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"
rand = "0.8"
